<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' qrc:; script-src 'self' qrc:; style-src 'self'; img-src 'self' data:; connect-src 'none'">
  <title>turniamo</title>
  <link rel="stylesheet" href="style.css">
  <script src="qrc:///qtwebchannel/qwebchannel.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="toolbar">
    <nav id="tabs" aria-label="Navigazione"></nav>
    <div class="week-controls">
      <button id="previous" class="icon-button" aria-label="Settimana precedente"></button>
      <select id="weeks" aria-label="Settimana"></select>
      <button id="next" class="icon-button" aria-label="Settimana successiva"></button>
      <button id="new-week" class="quiet-button"></button>
    </div>
    <div class="tools">
      <button id="export" class="icon-button" aria-label="Esporta"></button>
      <button id="settings" class="icon-button" aria-label="Impostazioni"></button>
    </div>
  </header>
  <main id="main"></main>
  <div id="popover" class="popover" hidden></div>
  <dialog id="dialog"></dialog>
  <div id="toast" role="status" hidden></div>
</body>
</html>
