name: Test and package desktop app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            name: Windows
            arch: x64
          - os: macos-15
            name: macOS-AppleSilicon
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: ${{ matrix.arch }}
      - name: Check publishable source files
        run: python scripts/check_public_files.py
      - name: Check release version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c "import os, tomllib; v = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']; assert os.environ['RELEASE_TAG'] == 'v' + v, 'Tag must match pyproject.toml version'"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python scripts/build.py
      - run: python scripts/smoke_packaged.py
      - name: Prepare Windows download
        if: runner.os == 'Windows'
        shell: pwsh
        run: Move-Item dist/turniamo.exe dist/turniamo-Windows.exe
      - name: Archive macOS bundle preserving executable permissions
        if: runner.os == 'macOS'
        run: |
          test "$(uname -m)" = arm64
          ditto -c -k --sequesterRsrc --keepParent dist/turniamo.app dist/turniamo-macOS-AppleSilicon.zip
      - uses: actions/upload-artifact@v7
        with:
          name: turniamo-${{ matrix.name }}
          path: |
            dist/turniamo-Windows.exe
            dist/turniamo-macOS-AppleSilicon.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: desktop
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: turniamo-*
          path: release-assets
          merge-multiple: true
      - name: Verify release files and create checksums
        working-directory: release-assets
        run: |
          test -s turniamo-Windows.exe
          test -s turniamo-macOS-AppleSilicon.zip
          cp ../LICENSE LICENSE
          sha256sum turniamo-Windows.exe turniamo-macOS-AppleSilicon.zip > SHA256SUMS.txt
      - name: Publish both verified packages together
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "turniamo $RELEASE_TAG" --notes-file .github/RELEASE_NOTES.md
          fi
          gh release upload "$RELEASE_TAG" release-assets/turniamo-Windows.exe release-assets/turniamo-macOS-AppleSilicon.zip release-assets/SHA256SUMS.txt release-assets/LICENSE --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
