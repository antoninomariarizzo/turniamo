[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "turniamo"
version = "0.1.3"
description = "Local, bilingual hospital shift planner"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "openpyxl>=3.1,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6,<7"]

[project.scripts]
turniamo = "turniamo.app:main"

[tool.setuptools.packages.find]
include = ["turniamo*"]

[tool.setuptools.package-data]
turniamo = ["web/*.html", "web/*.css", "web/*.js", "assets/*.png", "assets/*.ico", "assets/*.icns"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
